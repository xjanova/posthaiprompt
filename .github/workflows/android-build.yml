name: Android · Build & Release APK

# Triggers:
#  - push tag like v1.2.3       → build signed release APK + create a release (auto-updater consumes this)
#  - manual workflow_dispatch    → build APK without releasing (for testing)
#  - PR to main affecting flutter_app → build APK + upload as artifact (smoke test, no release)
on:
  push:
    tags:
      - 'v*'
  pull_request:
    paths:
      - 'flutter_app/**'
      - '.github/workflows/android-build.yml'
  workflow_dispatch:

permissions:
  contents: write   # required to create releases

defaults:
  run:
    working-directory: flutter_app

jobs:
  build:
    name: Build APK
    runs-on: ubuntu-latest
    timeout-minutes: 30

    # Lift secret into env once (cannot be referenced directly in step `if:`).
    env:
      RELEASE_KEYSTORE_BASE64: ${{ secrets.RELEASE_KEYSTORE_BASE64 }}
      RELEASE_STORE_PASSWORD: ${{ secrets.RELEASE_STORE_PASSWORD }}
      RELEASE_KEY_PASSWORD: ${{ secrets.RELEASE_KEY_PASSWORD }}
      RELEASE_KEY_ALIAS: ${{ secrets.RELEASE_KEY_ALIAS }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Java 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.41.7'
          channel: 'stable'
          cache: true

      - name: Show versions
        run: |
          flutter --version
          dart --version
          java -version

      - name: Get dependencies
        run: flutter pub get

      - name: Verify analysis
        run: flutter analyze --no-fatal-infos --no-fatal-warnings || true

      - name: Decode keystore
        if: env.RELEASE_KEYSTORE_BASE64 != ''
        run: |
          echo "$RELEASE_KEYSTORE_BASE64" | base64 -d > android/app/upload-keystore.jks
          ls -la android/app/upload-keystore.jks

      - name: Write key.properties
        if: env.RELEASE_KEYSTORE_BASE64 != ''
        run: |
          cat > android/key.properties <<EOF
          storePassword=${RELEASE_STORE_PASSWORD}
          keyPassword=${RELEASE_KEY_PASSWORD}
          keyAlias=${RELEASE_KEY_ALIAS}
          storeFile=upload-keystore.jks
          EOF

      - name: Resolve build name from tag (or fallback to dev)
        id: vars
        run: |
          if [[ "${GITHUB_REF}" == refs/tags/v* ]]; then
            echo "build_name=${GITHUB_REF_NAME#v}" >> "$GITHUB_OUTPUT"
            echo "tag=${GITHUB_REF_NAME}" >> "$GITHUB_OUTPUT"
          else
            echo "build_name=0.0.0-dev" >> "$GITHUB_OUTPUT"
            echo "tag=dev" >> "$GITHUB_OUTPUT"
          fi

      - name: Build APK (release)
        run: |
          flutter build apk --release \
            --build-name=${{ steps.vars.outputs.build_name }} \
            --build-number=${{ github.run_number }}

      - name: Rename APK
        run: |
          mkdir -p out
          cp build/app/outputs/flutter-apk/app-release.apk \
             out/posthaiprompt-${{ steps.vars.outputs.tag }}.apk
          ls -la out/

      - name: Upload artifact (every run)
        uses: actions/upload-artifact@v4
        with:
          name: posthaiprompt-apk-${{ steps.vars.outputs.tag }}
          path: flutter_app/out/*.apk
          retention-days: 30

      - name: Create GitHub Release (tags only)
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.ref_name }}
          name: ${{ github.ref_name }}
          generate_release_notes: false
          files: flutter_app/out/*.apk
          # Release notes are shown inside the app's update dialog — keep them
          # end-user friendly (no build-system or hosting wording).
          body: |
            Thai Prompt POS ${{ github.ref_name }}

            • ผู้ใช้เดิม: แอปจะแจ้งอัปเดตเอง กดติดตั้งได้ทันที ข้อมูลร้านยังอยู่ครบ
            • Android: ติดตั้งทับเวอร์ชันเดิม (อนุญาต "ติดตั้งแอปที่ไม่รู้จัก" ครั้งแรก)
            • Windows: แอปปิดตัวเอง ติดตั้งไฟล์ใหม่ แล้วเปิดขึ้นมาอีกครั้ง

            xman studio · xman4289.com
