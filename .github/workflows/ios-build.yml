name: iOS · Build (unsigned archive)

# Builds an unsigned iOS archive for review. Signed TestFlight distribution
# requires Apple Developer account secrets — wire those in when ready.
on:
  push:
    tags:
      - 'v*'
  pull_request:
    paths:
      - 'flutter_app/**'
      - '.github/workflows/ios-build.yml'
  workflow_dispatch:

permissions:
  contents: write

defaults:
  run:
    working-directory: flutter_app

jobs:
  build:
    name: Build iOS (unsigned)
    runs-on: macos-latest
    timeout-minutes: 30

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.41.7'
          channel: 'stable'
          cache: true

      - name: Show versions
        run: |
          flutter --version
          dart --version
          xcodebuild -version

      - name: Get dependencies
        run: flutter pub get

      - name: Verify analysis
        run: flutter analyze --no-fatal-infos --no-fatal-warnings
        continue-on-error: true

      - name: Resolve build name from tag
        id: vars
        run: |
          if [[ "${GITHUB_REF}" == refs/tags/v* ]]; then
            echo "build_name=${GITHUB_REF_NAME#v}" >> "$GITHUB_OUTPUT"
            echo "tag=${GITHUB_REF_NAME}" >> "$GITHUB_OUTPUT"
          else
            echo "build_name=0.0.0-dev" >> "$GITHUB_OUTPUT"
            echo "tag=dev" >> "$GITHUB_OUTPUT"
          fi

      - name: Build iOS (no codesign)
        run: |
          flutter build ios --release --no-codesign \
            --build-name=${{ steps.vars.outputs.build_name }} \
            --build-number=${{ github.run_number }}

      - name: Package .app (unsigned)
        run: |
          mkdir -p out
          cd build/ios/iphoneos
          zip -r ../../../out/posthaiprompt-ios-${{ steps.vars.outputs.tag }}-unsigned.zip Runner.app
          ls -la ../../../out/

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: posthaiprompt-ios-${{ steps.vars.outputs.tag }}-unsigned
          path: flutter_app/out/*.zip
          retention-days: 30
