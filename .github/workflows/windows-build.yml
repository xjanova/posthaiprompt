name: Windows · Build & Release MSIX

# Triggers:
#  - push tag like v1.2.3       → build Windows app + attach .zip to GitHub Release
#  - manual workflow_dispatch    → build for testing
#  - PR to main affecting flutter_app/ → build + upload artifact (smoke test)
on:
  push:
    tags:
      - 'v*'
  pull_request:
    paths:
      - 'flutter_app/**'
      - '.github/workflows/windows-build.yml'
  workflow_dispatch:

permissions:
  contents: write

defaults:
  run:
    working-directory: flutter_app

jobs:
  build:
    name: Build Windows
    runs-on: windows-latest
    timeout-minutes: 30

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.41.7'
          channel: 'stable'
          cache: true

      - name: Enable Windows desktop
        run: flutter config --enable-windows-desktop

      - name: Show versions
        run: |
          flutter --version
          dart --version

      - name: Get dependencies
        run: flutter pub get

      - name: Verify analysis
        run: flutter analyze --no-fatal-infos --no-fatal-warnings
        continue-on-error: true

      - name: Resolve build name from tag
        id: vars
        shell: bash
        run: |
          if [[ "${GITHUB_REF}" == refs/tags/v* ]]; then
            echo "build_name=${GITHUB_REF_NAME#v}" >> "$GITHUB_OUTPUT"
            echo "tag=${GITHUB_REF_NAME}" >> "$GITHUB_OUTPUT"
          else
            echo "build_name=0.0.0-dev" >> "$GITHUB_OUTPUT"
            echo "tag=dev" >> "$GITHUB_OUTPUT"
          fi

      - name: Build Windows (release)
        run: |
          flutter build windows --release `
            --build-name=${{ steps.vars.outputs.build_name }} `
            --build-number=${{ github.run_number }}

      - name: Zip Windows build
        shell: pwsh
        run: |
          $src = "build/windows/x64/runner/Release"
          $dst = "out/posthaiprompt-windows-${{ steps.vars.outputs.tag }}.zip"
          New-Item -ItemType Directory -Force -Path out | Out-Null
          Compress-Archive -Path "$src/*" -DestinationPath $dst -Force
          Get-ChildItem out

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: posthaiprompt-windows-${{ steps.vars.outputs.tag }}
          path: flutter_app/out/*.zip
          retention-days: 30

      - name: Attach to GitHub Release (tags only)
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.ref_name }}
          files: flutter_app/out/*.zip
